<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'>
  <!-- Star pointer tip at (3, 3) (Energetic Red-Orange) -->
  <polygon points='3,0 4.2,2.2 6.5,3 4.2,3.8 3,6 1.8,3.8 -0.5,3 1.8,2.2' fill='#EF4444' stroke='#B91C1C' stroke-width='0.5'/>
  <circle cx='3' cy='3' r='1' fill='#FFFFFF'/>

  <!-- Orbiting Satellite line -->
  <path d='M7 19 C8 11, 23 7, 28 14' fill='none' stroke='#FCD34D' stroke-width='1' stroke-dasharray='2 2' opacity='0.85'/>
  <!-- Mini Satellite at (27, 13) -->
  <rect x='25.5' y='11.5' width='2.5' height='2.5' fill='#F59E0B' transform='rotate(25 26.7 12.7)'/>
  <line x1='24' y1='11' x2='29' y2='14' stroke='#60A5FA' stroke-width='1'/>

  <!-- Atmosphere outer glow (Enhanced golden-cyan aura) -->
  <circle cx='17' cy='17' r='11.5' fill='#38BDF8' opacity='0.45'/>
  <circle cx='17' cy='17' r='9.5' fill='#FDE047' opacity='0.25'/>

  <!-- Earth Ocean base -->
  <defs>
    <radialGradient id='oceanGradPtr' cx='40%' cy='35%' r='65%'>
      <stop offset='0%' stop-color='#38BDF8'/>
      <stop offset='55%' stop-color='#0284C7'/>
      <stop offset='100%' stop-color='#0369A1'/>
    </radialGradient>
    <clipPath id='earthClipPtr'>
      <circle cx='17' cy='17' r='8'/>
    </clipPath>
  </defs>

  <circle cx='17' cy='17' r='8' fill='url(#oceanGradPtr)'/>

  <!-- Continents clipped to sphere -->
  <g clip-path='url(#earthClipPtr)'>
    <!-- Americas (Left) -->
    <path d='M10 11 C11 11, 13 13, 12 15 C11 17, 12 19, 13 21 C12 22, 10 22, 10 20 C9 18, 9 14, 10 11 Z' fill='#4ADE80'/>
    <!-- Eurasia & Africa (Center-Right) -->
    <path d='M15 10 C18 9, 21 11, 23 12 C24 14, 23 16, 21 16 C19 16, 18 14, 16 13 Z' fill='#22C55E'/>
    <path d='M16 16 C18 15, 21 17, 22 20 C20 22, 18 22, 16 19 Z' fill='#4ADE80'/>
    <circle cx='21' cy='22' r='1.2' fill='#86EFAC'/>
    
    <!-- White cloud swirls -->
    <path d='M11 13 Q15 10.5 19 13' fill='none' stroke='#FFFFFF' stroke-width='1.3' stroke-linecap='round' opacity='0.85'/>
    <path d='M14 20 Q18 18.5 22 21' fill='none' stroke='#FFFFFF' stroke-width='1.2' stroke-linecap='round' opacity='0.8'/>

    <!-- 3D shading -->
    <path d='M11 20 A8 8 0 0 0 25 17 A8 8 0 0 1 11 20' fill='#0C4A6E' opacity='0.32'/>
  </g>

  <!-- Atmosphere ring highlight -->
  <circle cx='17' cy='17' r='8' fill='none' stroke='#E0F2FE' stroke-width='1' opacity='0.9'/>

  <!-- Specular shine -->
  <circle cx='13.8' cy='13.2' r='2' fill='#FFFFFF' opacity='0.95'/>

  <!-- Sparkles -->
  <polygon points='26,4 26.8,5.8 28.5,6.5 26.8,7.2 26,9 25.2,7.2 23.5,6.5 25.2,5.8' fill='#FBBF24'/>
</svg>